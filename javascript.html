<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Estructura de control en JS</h1>
   
<h2>1. Secuencial:</h2>
<button id="demo4">Ver demo</button>
<p id="resultado1"></p>
<p id="resultado2"></p>
<script>
let boton4 = document.getElementById("demo4");
boton4.addEventListener("click", function() {
// 1. Entrada de datos
let valor1 = prompt('Ingrese el primer número:');
let valor2 = prompt('Ingrese el segundo número:');

// 2. Selección de los elementos HTML
let res1 = document.getElementById("resultado1");
let res2 = document.getElementById("resultado2");

// 3. Proceso (operaciones matemáticas)
let suma = parseInt(valor1) + parseInt(valor2);
let producto = parseInt(valor1) * parseInt(valor2);

// 4. Salida
res1.innerHTML = 'La suma es: ' + suma;
res2.innerHTML = 'El producto es: ' + producto;
})
</script>

<h2>2.Condicional:</h2>
<ul>
<li>
<h3>If </h3>
<button id="demo1">Ver demo</button>
<script>
let boton1 = document.getElementById("demo1");
boton1.addEventListener("click", function() {
let edad = prompt('Ingrese la edad:');
if (edad >= 18) {
alert("Puedes ingresar a esta sección");
}
});
</script>
</li>
<li>
<h3>Estructura if...else:</h3>
<button id="demo2">Ver ejemplo</button>
<script>
let boton2 = document.getElementById("demo2");
boton2.addEventListener("click", function() {
let edad = prompt('Ingrese la edad:');
if (edad >= 18) {
alert("Puedes ingresar a esta sección");
} else {
alert("NO Puedes ingresar a esta sección");
}
});
</script>
</li>
<li>
    <h3>Estructura if...else if...else:</h3>
    <button id="demo3">Ver ejemplo</button>
    <script>
    let boton3 = document.getElementById("demo3");
    boton3.addEventListener("click", function() {
    let nota = prompt('Ingrese la calificación:');
    if (nota >= 9) {
    alert("Excelente");
    } else if (nota >= 6) {
    alert("Aprobado");
    } else {
    alert("Debes recuperar");
    }
    });
    </script>
</li>
</ul>
</body>
</html>
